<!DOCTYPE html>
<html>
<head>
    <title>Login | Smart Loan Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h2>🔐 Welcome Back</h2>
        <p class="subtitle">Smart Loan EMI Analytics</p>

        {% if error %}
        <div class="error-message" style="color: #e53e3e; background: #fff5f5; border: 1px solid #fed7d7; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; font-size: 0.9em; font-weight: 500;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" id="loginForm">

            <div class="input-group">
                <input type="text" name="username" id="username" required>
                <label>Username</label>
            </div>

            <div class="input-group">
                <input type="password" name="password" id="password" required>
                <label>Password</label>
                <span class="toggle" onclick="togglePassword()">👁</span>
            </div>

            <button type="submit" class="login-btn">Login</button>

            <p class="signup-link">
                Don't have account?
                <a href="/signup">Signup</a>
            </p>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='login.js') }}"></script>

</body>
</html>
